name: BierXP
main: de.bierxp.BierXP
version: 2.0.0
api-version: '1.21'
author: RicoDessau
description: XP-Bank mit Rico dem XP-Dealer.

depend:
  - Citizens

commands:
  bierxp:
    description: Hauptbefehl für BierXP
    usage: /bierxp <spawn|despawn>
    permission: bierxp.admin

permissions:
  bierxp.admin:
    description: Erlaubt die Verwaltung des BierXP-NPCs.
    default: op
