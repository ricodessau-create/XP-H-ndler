name: BierXP
main: de.bierxp.BierXP
version: 1.0.0
api-version: '1.21'
author: RicoDessau
depend:
  - ProtocolLib
commands:
  spawnnpc:
    description: Spawnt einen NPC
    usage: /spawnnpc
    permission: bierxp.spawnnpc
  despawnnpc:
    description: Entfernt den NPC
    usage: /despawnnpc
    permission: bierxp.spawnnpc
permissions:
  bierxp.spawnnpc:
    default: op
